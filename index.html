<style>
  :root{
    --bg:#0B0F14; --card:#141A22; --card2:#1B232E; --line:#26303C;
    --txt:#E6EDF3; --muted:#8696A7; --accent:#34D399; --accent2:#22D3EE;
    --warn:#F59E0B; --bad:#475569; --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
  body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
  .wrap{max-width:520px;margin:0 auto;padding:0 16px}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--bg) 70%,transparent);
    padding:calc(12px + env(safe-area-inset-top)) 16px 10px}
  .hdr{display:flex;align-items:center;justify-content:space-between;max-width:520px;margin:0 auto}
  .brand{font-weight:700;font-size:18px;letter-spacing:.2px}
  .streakpill{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
    padding:7px 12px;border-radius:999px;font-weight:700}
  .streakpill .n{color:var(--accent);font-size:16px}
  .streakpill .f{font-size:16px}
  h2.title{font-size:22px;margin:6px 0 2px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
  .row{display:flex;align-items:center;gap:10px}
  .between{justify-content:space-between}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .tiny{font-size:12px}
  .datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  .navbtn{background:var(--card);border:1px solid var(--line);color:var(--txt);width:40px;height:40px;
    border-radius:12px;font-size:18px;display:grid;place-items:center}
  .navbtn:active{background:var(--card2)}
  .daychip{flex:1;text-align:center}
  .daychip .d{font-weight:700;font-size:15px}
  .daychip .t{color:var(--muted);font-size:12px}
  .focus{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
    padding:3px 8px;border-radius:999px;background:rgba(52,211,153,.12);color:var(--accent);border:1px solid rgba(52,211,153,.25)}
  .focus.hyp{background:rgba(34,211,238,.12);color:var(--accent2);border-color:rgba(34,211,238,.25)}
  .ex{padding:12px 0;border-top:1px solid var(--line)}
  .ex:first-child{border-top:0}
  .exhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
  .exmeta{display:flex;align-items:center;gap:7px;flex:0 0 auto}
  .exname{font-weight:700;font-size:15px}
  .exnamebutton{border:0;background:none;color:var(--txt);font:inherit;font-weight:700;font-size:15px;padding:0;text-align:left;cursor:pointer}
  .exnamebutton::after{content:'⌄';color:var(--accent2);font-size:13px;margin-left:6px}.exnamebutton.open::after{content:'⌃'}
  .technique{margin:2px 0 10px;padding:10px;background:var(--card2);border:1px solid var(--line);border-radius:12px}
  .technique h3{font-size:13px;margin:0 0 6px}.technique p{font-size:12px;color:var(--muted);line-height:1.4;margin:6px 0 0}
  .exercise-action{border:1px solid rgba(52,211,153,.4);border-radius:10px;background:rgba(52,211,153,.12);color:var(--accent);padding:8px 10px;font-weight:800;font-size:12px;white-space:nowrap}
  .exercise-action.done{background:rgba(52,211,153,.2);animation:exerciseComplete .45s ease-out}
  .exercise-active{margin:4px 0 10px;padding:10px;border:1px solid rgba(52,211,153,.35);border-radius:12px;background:linear-gradient(135deg,rgba(52,211,153,.09),var(--card2));animation:exerciseOpen .22s ease-out}
  .exercise-info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.exercise-info div{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px;line-height:1.35}.exercise-info b{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.35px;margin-bottom:3px}
  .finish-exercise{margin-top:10px;background:var(--card);color:var(--accent);border:1px solid rgba(52,211,153,.45)}
  .mode-toggle{border:1px solid rgba(34,211,238,.35);border-radius:10px;background:rgba(34,211,238,.1);color:var(--accent2);padding:7px 9px;font-size:12px;font-weight:800;white-space:nowrap}
  .workout-progress{border:1px solid rgba(52,211,153,.35);border-radius:999px;background:rgba(52,211,153,.1);color:var(--accent);padding:6px 8px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
  .workout-mode .ex:not(.active){display:none}.workout-mode .ex.active{border-top:0;padding-top:0}
  .mode-note{color:var(--accent2);font-size:12px;margin:-2px 0 10px}
  @keyframes exerciseOpen{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes exerciseComplete{0%{transform:scale(.94)}65%{transform:scale(1.04)}100%{transform:scale(1)}}
  .technique-frames{position:relative;height:176px;max-width:220px;margin:0 auto;overflow:hidden;border-radius:10px;background:#52747c}
  .technique-frames img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;animation:techFrames 2.1s infinite}
  .technique-frames img:nth-child(2){animation-delay:-.7s}.technique-frames img:nth-child(3){animation-delay:-1.4s}
  @keyframes techFrames{0%,33.3%{opacity:1}33.34%,100%{opacity:0}}
  .scheme{color:var(--muted);font-size:12px;white-space:nowrap}
  .last{color:var(--accent2);font-size:12px;margin-top:1px}
  .pr{color:var(--warn);font-size:11px;font-weight:700}
  .sets{display:flex;flex-direction:column;gap:7px}
  .setrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center}
  .setrow.time{grid-template-columns:1fr}
  .field{position:relative}
  .field input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);
    border-radius:11px;padding:11px 40px 11px 12px;font-size:16px;font-weight:600;outline:none}
  .field input:focus{border-color:var(--accent)}
  .field.wide input{padding-right:74px}
  .field .u{position:absolute;right:42px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px;pointer-events:none}
  .field .sep{position:absolute;right:4px;top:4px;bottom:4px;width:30px;padding:0;background:var(--card);
    border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:16px;font-weight:700;
    line-height:1;display:grid;place-items:center}
  .field .sep:active{background:var(--accent);border-color:var(--accent);color:#04110b}
  .filled input{border-color:rgba(52,211,153,.4)}
  .hint{color:var(--muted);font-size:12px;line-height:1.45}
  .hint b{color:var(--txt)}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;color:#04110b;
    background:var(--accent)}
  .btn:active{filter:brightness(.95)}
  .btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--line)}
  .btn.done{background:var(--card);color:var(--accent);border:1px solid rgba(52,211,153,.4)}
  .btn.sm{padding:11px;font-size:14px;border-radius:12px}
  .seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{background:none;border:0;color:var(--muted);padding:6px 13px;font-size:13px;font-weight:700}
  .seg button.on{background:var(--accent);color:#04110b}
  .seg.sm button{padding:4px 9px;font-size:12px}
  .banner{background:linear-gradient(135deg,rgba(245,158,11,.14),rgba(245,158,11,.05));
    border:1px solid rgba(245,158,11,.3);border-radius:14px;padding:12px 14px;margin-bottom:12px}
  .banner b{color:var(--warn)}
  .treadmill{border-color:rgba(34,211,238,.32);background:linear-gradient(135deg,rgba(34,211,238,.1),var(--card))}
  .treadhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .treadtitle{font-size:16px;font-weight:800}.treadmeta{color:var(--accent2);font-size:12px;font-weight:700;white-space:nowrap}
  .timer-ring{width:108px;height:108px;border-radius:50%;display:grid;place-items:center;margin:12px auto;position:relative}
  .timer-ring:before{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--card)}
  .timer-ring span{position:relative;font-variant-numeric:tabular-nums;font-size:24px;font-weight:800;letter-spacing:.5px}
  .treadtimer{font-variant-numeric:tabular-nums;font-size:34px;font-weight:800;letter-spacing:1px;margin:10px 0 2px}
  .treadstage{font-size:14px;font-weight:700}.treadhint{font-size:12px;color:var(--muted);margin-top:4px}
  .treadlist{margin-top:12px;border-top:1px solid var(--line)}
  .treadrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
  .treadrow.active{color:var(--accent2);font-weight:700}.treadrow.done{opacity:.5}
  .treadnum{width:18px;color:var(--muted)}.treadrow span:last-child{margin-left:auto;white-space:nowrap}
  .treadcontrols{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.treadcontrols .btn{margin:0;flex:1 1 92px}
  .rest-timer{border-color:rgba(52,211,153,.32)}
  .rest-timer .timer-ring:before{background:var(--card)}
  .rest-launcher{position:fixed;right:max(16px,calc((100vw - 520px)/2 + 16px));bottom:calc(88px + env(safe-area-inset-bottom));z-index:18;border:1px solid rgba(52,211,153,.45);border-radius:999px;background:var(--card2);color:var(--txt);padding:10px 14px;font-size:13px;font-weight:800;box-shadow:0 8px 20px rgba(0,0,0,.25)}
  .rest-launcher span{color:var(--accent);font-variant-numeric:tabular-nums;margin-left:5px}
  .rest-widget{position:fixed;z-index:19;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));width:min(calc(100vw - 24px),496px);margin:0;transform:translate(-50%,calc(100% + 32px));opacity:0;pointer-events:none;transition:transform .2s ease,opacity .2s ease;box-shadow:0 -8px 30px rgba(0,0,0,.32)}
  .rest-widget.open{transform:translate(-50%,0);opacity:1;pointer-events:auto}
  .rest-widget .timer-ring{margin:8px auto}.rest-widget .treadcontrols{margin-top:8px}
  .rest-close{border:0;background:none;color:var(--muted);font-size:24px;line-height:1;padding:0 2px}
  /* nav */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(11,15,20,.92);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
  .navinner{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
  .tab{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:11px;font-weight:600;padding:4px}
  .tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tab.active{color:var(--accent)}
  /* calendar */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
  .cal .dow{color:var(--muted);font-size:11px;text-align:center;font-weight:700;padding-bottom:2px}
  .cell{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:13px;
    background:var(--card2);border:1px solid transparent;color:var(--muted);position:relative}
  .cell.done{background:rgba(52,211,153,.18);border-color:rgba(52,211,153,.5);color:var(--txt);font-weight:700}
  .cell.miss{background:rgba(71,85,105,.18);color:#64748b}
  .cell.rest{opacity:.45}
  .cell.today{border-color:var(--accent2)}
  .cell.empty{background:none;border:0}
  .statgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:4px}
  .stat{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
  .stat .v{font-size:24px;font-weight:800}
  .stat .v.a{color:var(--accent)} .stat .v.b{color:var(--accent2)} .stat .v.c{color:var(--warn)}
  .stat .l{color:var(--muted);font-size:11px;margin-top:2px;text-transform:uppercase;letter-spacing:.4px}
  select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);
    border-radius:12px;padding:12px;font-size:15px;font-weight:600;-webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='%238696A7'><path d='M2 4l5 6 5-6z'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center}
  canvas{width:100%;display:block}
  .histrow{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
  .histrow:first-child{border-top:0}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
  .dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .hide{display:none}
  .center{text-align:center}
  .emptyst{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
  .body-form{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.body-form .field input{padding-right:42px}
  .body-form .btn{width:auto;white-space:nowrap}.photo-actions{display:flex;gap:8px;margin-top:8px}.photo-actions .btn{margin:0;flex:1}
  .photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.photo-grid figure{margin:0}.photo-grid img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line)}.photo-grid figcaption{font-size:10px;color:var(--muted);margin-top:3px;text-align:center}
</style>
</head>
<body>
<header><div class="hdr">
  <div class="brand">Тренировки</div>

<main class="wrap">
  <div id="view"></div>
</main>

<nav><div class="navinner">
  <button class="tab" data-tab="today"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Сегодня</button>

</div></nav>

<script>
/* ---------- Program ---------- */
const e=(id,name,sets,target,m='load',note='')=>({id,name,sets,target,m,note});
const REST={id:'rest',name:'Отдых',type:'rest',note:'Восстановление. Следующая тренировка - по плану.'};
const PHASES = [
  {name:'Недели 1-4',days:{
    1:{id:'day1',name:'День 1 · Плечи / трапеции',focus:'Недели 1-4',type:'lift',ex:[e('seated_db_press','Жим гантелей сидя',4,'6-8'),e('upright_row','Тяга штанги к подбородку',3,'10-12'),e('rear_delt_fly','Разведение гантелей через стороны в наклоне',3,'10-12'),e('arnold_press','Жим Арнольда',3,'8-10'),e('lateral_raise','Разведение гантелей через стороны',1,100),e('barbell_shrug','Шраги со штангой',5,5)]},
    2:{id:'day2',name:'День 2 · Ноги / руки',focus:'Недели 1-4',type:'lift',ex:[e('back_squat','Приседания со штангой',4,'15/12/8/20'),e('rdl','Румынская тяга',4,'12/10/8/15'),e('barbell_curl','Подъем штанги на бицепс',3,'6-8'),e('reverse_close_grip_bench','Жим лежа узким хватом в обратном наклоне',3,'6-8'),e('preacher_curl','Подъем штанги на бицепс на скамье Скотта',3,'10-12'),e('db_french_press','Французский жим с гантелями',3,'10-12'),e('hammer_curl','Сгибание рук с гантелями (молот)',3,'12-15'),e('tricep_pushdown','Разгибание рук в вертикальном блоке',3,'12-15')]},
    4:{id:'day3',name:'День 3 · Трапеции / плечи',focus:'Недели 1-4',type:'lift',ex:[e('barbell_shrug','Шраги со штангой',4,'6-8'),e('smith_shrug','Шраги в машине Смита (гриф за спиной)',3,'10-12'),e('upright_row','Тяга штанги к подбородку',3,'10-12'),e('calf_raise','Подъем на носки',3,'8-10'),e('rear_delt_fly','Разведение гантелей через стороны в наклоне',1,100),e('military_press','Армейский жим',5,5)]},
    6:{id:'day4',name:'День 4 · Грудь / спина',focus:'Недели 1-4',type:'lift',ex:[e('incline_barbell_press','Жим штанги на наклонной скамье',3,'6-8'),e('barbell_row','Тяга штанги в наклоне',3,'6-8'),e('flat_db_press','Жим гантелей лежа',3,'10-12'),e('lat_pulldown','Верхняя тяга к груди',3,'10-12'),e('decline_barbell_press','Жим штанги в обратном наклоне',3,'12-15'),e('seated_cable_row','Тяга горизонтального блока',3,'12-15')]}

function load(){
  let d=null,restored=false;
  try{d=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  if(!d||!d.sessions){                            // primary missing/corrupt → fall back before writing anything
    let b=null;try{b=JSON.parse(localStorage.getItem(BKEY));}catch(e){}
    if(b&&b.sessions&&Object.keys(b.sessions).length){d=b;restored=true;}
  }
  if(!d||!d.sessions)d={meta:{startDate:null},sessions:{}};
  if(!d.settings)d.settings={unit:'kg'};
  if(!d.settings.exUnit)d.settings.exUnit={};   // per-exercise unit preference
  if(!d.body)d.body={entries:{}};
  if(!d.body.entries||typeof d.body.entries!=='object')d.body.entries={};
  if(!d.overrides)d.overrides={};               // per-date workout swap: {date: dayId}
  if(!d.shifts)d.shifts=[];                      // schedule shifts: [{from, days}] append-only
  if(restored){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}  // repair the primary record now
  return d;
}
function save(){
  const j=JSON.stringify(data);
  try{
    localStorage.setItem(KEY,j);
    if(data.sessions&&Object.keys(data.sessions).length)localStorage.setItem(BKEY,j);
    return true;
  }catch(e){return false}
}

/* ---------- Units ---------- */
const LB=2.20462262;
function unit(){return data.settings.unit;}            // active input unit
function toKg(w,u){return (u==='lb')?(+w)/LB:+w;}
function fromKg(kg,u){return (u==='lb')?kg*LB:kg;}
function rnd(x){return Math.round(x*10)/10;}
function fmtN(x){return String(rnd(x));}
function targetTop(ex){
  const nums=String(ex.target).match(/\d+/g)||[];
  return String(ex.target).includes('/')?null:Math.max(...nums.map(Number));
}
function recommendedWeight(ex,sets,u){
  if(ex.m!=='load')return '';
  const stored=(sets||[]).filter(s=>s&&s.w!=null);
  const top=targetTop(ex);
  if(stored.length&&top&&stored.every(s=>+s.r>=top)){
    const add=/db|raise|curl|fly/.test(ex.id)?1:2.5;
    return stored.map(s=>fmtN(fromKg(toKg(s.w,s.u||'kg')+add,u))).join(', ');
  }
  if(stored.length)return setsToList(sets,'w',ex,u);
  const start=START_WEIGHTS[ex.id];
  return start?start.map(v=>fmtN(fromKg(v,u))).join(', '):'';
}
function segUnit(active,fn){return `<div class="seg">
  <button class="${active==='kg'?'on':''}" onclick="${fn}('kg')">kg</button>
  <button class="${active==='lb'?'on':''}" onclick="${fn}('lb')">lb</button></div>`;}
function setProgUnit(u){progUnit=u;render();}
function exUnit(id){return data.settings.exUnit[id]||data.settings.unit||'kg';}  // unit for a given exercise
function setExUnit(id,u){data.settings.exUnit[id]=u;save();render();}
function segUnitEx(id,active){return `<div class="seg sm">
  <button class="${active==='kg'?'on':''}" onclick="setExUnit('${id}','kg')">kg</button>
  <button class="${active==='lb'?'on':''}" onclick="setExUnit('${id}','lb')">lb</button></div>`;}

/* ---------- Date helpers (local) ---------- */
function todayStr(){return fmt(new Date())}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)}
function dow(s){return parse(s).getDay()}
function phaseIndex(s){
  if(!data.meta.startDate)return 0;
  return Math.min(2,Math.max(0,Math.floor((parse(s)-parse(data.meta.startDate))/864e5/28)));
}
function phaseFor(s){return PHASES[phaseIndex(s)]}
function defaultProg(s){return phaseFor(s).days[dow(s)]||REST}
function programById(s,id){
  if(id==='rest')return REST;
  return Object.values(phaseFor(s).days).find(p=>p.id===id)||null;
}
function shiftFor(s){let n=0;if(data.shifts)for(const seg of data.shifts){if(seg.from<=s)n=seg.days}return n}
function prog(s){
  const o=data.overrides&&data.overrides[s];
  const override=o&&programById(s,o);
  if(override)return override;                               // 1. explicit per-day swap wins
  return defaultProg(addDays(s,-shiftFor(s)));                // 2. shifted weekday, else default (shift 0)
}
function isOverridden(s){const o=data.overrides&&data.overrides[s];return !!(o&&o!==defaultProg(s).id)}
function shortDow(s){return ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][dow(s)]}
function setOverride(s,id){
  if(!data.overrides)data.overrides={};
  if(!id||id===defaultProg(s).id)delete data.overrides[s];
  else data.overrides[s]=id;
  save();render();
}
function setShift(s,id){                                      // re-anchor plan from date s forward
  const targetWd=id?WEEKDAY_OF_ID[id]:dow(s);                // '' => realign to calendar (shift 0)
  const n=(((dow(s)-targetWd)%7)+7)%7;
  if(!data.shifts)data.shifts=[];
  data.shifts=data.shifts.filter(seg=>seg.from!==s);         // replace any segment already starting today
  data.shifts.push({from:s,days:n});
  if(data.overrides)delete data.overrides[s];                // shift now governs this day
  save();render();
}
function isScheduled(s){return prog(s).type!=='rest'}
function pretty(s){const d=parse(s);return d.toLocaleDateString('ru-RU',{weekday:'long',month:'long',day:'numeric'})}

/* ---------- Sessions ---------- */
function getSession(s){return data.sessions[s]}
function ensureSession(s){
  if(!data.sessions[s]){data.sessions[s]={dayId:prog(s).id,type:prog(s).type,completed:false,sets:{},note:''}}
  if(!data.sessions[s].exerciseDone)data.sessions[s].exerciseDone={};
  return data.sessions[s];
}
function lastSets(exId,beforeDate){
  const dates=Object.keys(data.sessions).filter(d=>d<beforeDate).sort().reverse();
  for(const d of dates){const st=data.sessions[d].sets[exId];if(st&&st.some(v=>v&&(v.w||v.r||v.t)))return{date:d,sets:st};}
  return null;
}
function bestVal(ex,sets){ // canonical progression value (load → kg)
  if(!sets)return null;
  let v=null;
  sets.forEach(s=>{if(!s)return;
    let x;
    if(ex.m==='time') x=s.t;
    else if(ex.m==='reps') x=s.r;
    else x=(s.w==null||s.w===''||isNaN(+s.w))?null:toKg(s.w,s.u||'kg');
    if(x!=null&&x!==''&&!isNaN(x)) v=Math.max(v??-1e9, +x);
  });
  return v;
}

/* ---------- Set lists (one compact row per exercise) ----------
   Storage shape is unchanged: sets[exId] stays an array of {w,r,u} / {t} cells.
   These two functions only translate that array to/from a typed list like "60, 60, 55". */
function parseList(str){
  if(str==null)return [];
  const s=String(str).replace(/[^0-9.,\s]/g,' ').trim();
  if(s==='')return [];
  const out=(s.indexOf(',')>=0?s.split(','):s.split(/\s+/)).map(t=>t.trim());
  while(out.length&&out[out.length-1]==='')out.pop();   // trailing separator while typing
  return out;
}
function setCells(arr,key,ex){
  // Sibling-field values kept verbatim — same collapse rule as setsToList, but no unit
  // round-trip, so editing one field can never nudge the other's stored numbers.
  if(!arr||!arr.length)return [];
  const out=arr.map(c=>{
    if(!c)return null;
    const x=c[key];
    if(x==null||x===''||isNaN(+x))return null;
    return key==='w'?{w:+x,u:c.u||'kg'}:(key==='r'?{r:+x}:{t:+x});
  });
  while(out.length&&out[out.length-1]==null)out.pop();
  if(!out.length)return [];
  const same=v=>v&&out[0]&&v.w===out[0].w&&v.u===out[0].u&&v.r===out[0].r&&v.t===out[0].t;
  if(out.length===ex.sets&&out.every(same))return [out[0]];
  return out;
}
function setsToList(arr,key,ex,u){
  if(!arr||!arr.length)return '';
  const vals=arr.map(c=>{
    if(!c)return '';
    if(key==='w'){const w=c.w;return (w==null||w===''||isNaN(+w))?'':fmtN(fromKg(toKg(w,c.u||'kg'),u));}
    const x=c[key];return (x==null||x===''||isNaN(+x))?'':String(x);
  });
  while(vals.length&&vals[vals.length-1]==='')vals.pop();
  if(!vals.length)return '';
  // collapse to one number only when it re-expands to exactly the same thing
  if(vals.length===ex.sets&&vals.every(v=>v===vals[0]))return vals[0];
  return vals.join(', ');
}

/* ---------- Streak ---------- */
function isDone(s){const x=data.sessions[s];return x&&x.completed}
function currentStreak(){
  let n=0, d=todayStr();
  for(let i=0;i<400;i++){
    if(!isScheduled(d)){d=addDays(d,-1);continue;}       // rest day: skip, never breaks
    if(isDone(d)){n++;}
    else if(d===todayStr()){/* today not done yet: grace */}
    else break;
    d=addDays(d,-1);
  }
  return n;
}
function longestStreak(){
  const dates=Object.keys(data.sessions).filter(isDone).sort();
  if(!dates.length)return Math.max(currentStreak(),0);
  let best=0,run=0,d=dates[0];const end=todayStr();
  while(d<=end){
    if(!isScheduled(d)){d=addDays(d,1);continue;}
    if(isDone(d)){run++;best=Math.max(best,run);}else{run=0;}
    d=addDays(d,1);
  }
  return Math.max(best,currentStreak());
}
function weekProgress(){ // Mon-start week
  const t=parse(todayStr());const off=(t.getDay()+6)%7;const mon=addDays(todayStr(),-off);
  let done=0,total=0;
  for(let i=0;i<7;i++){const d=addDays(mon,i);if(isScheduled(d)){total++;if(isDone(d))done++;}}
  return{done,total};
}

/* ---------- Render ---------- */
const view=document.getElementById('view');
function render(){
  document.getElementById('streakHdr').textContent=currentStreak();
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  if(tab==='today')renderToday();
  else if(tab==='streak')renderStreak();
  else if(tab==='progress')renderProgress();
  else renderMore();
}

function deloadBanner(){
  if(!data.meta.startDate)return '';
  const days=Math.round((parse(cur)-parse(data.meta.startDate))/864e5);
  if(days<0||days>13)return '';
  return `<div class="banner small"><b>Первые 2 недели.</b> Начни с умеренного веса и оставляй 2-4 повтора в запасе.</div>`;
}

function timeLabel(sec){const m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function currentTreadmill(){return treadmill.rest?{name:'Отдых перед силовой тренировкой',minutes:2,incline:'Вода',speed:'Восстанови дыхание'}:TREADMILL[treadmill.phase]}
function ringBackground(remaining,total,color){const progress=Math.max(0,Math.min(100,(1-remaining/total)*100));return `conic-gradient(${color} ${progress}%,var(--card2) ${progress}% 100%)`}
function treadmillTotal(){return treadmill.rest?TREADMILL_REST:TREADMILL[treadmill.phase].minutes*60}
function updateTreadmillClock(){const el=document.getElementById('treadmillClock');if(el)el.textContent=timeLabel(treadmill.remaining);const ring=document.getElementById('treadmillRing');if(ring)ring.style.background=ringBackground(treadmill.remaining,treadmillTotal(),'var(--accent2)')}
function stopTreadmill(){if(treadmillInterval){clearInterval(treadmillInterval);treadmillInterval=null}treadmill.running=false}
function advanceTreadmill(){
  if(treadmill.rest){treadmill.complete=true;treadmill.rest=false;treadmill.remaining=0;stopTreadmill();render();return}
  if(treadmill.phase<TREADMILL.length-1){treadmill.phase++;treadmill.remaining=TREADMILL[treadmill.phase].minutes*60;stopTreadmill();render();return}
  treadmill.rest=true;treadmill.remaining=TREADMILL_REST;stopTreadmill();render();
}
function treadmillStart(){
  if(treadmill.complete)return;
  if(treadmill.running){stopTreadmill();render();return}
  treadmill.running=true;
  treadmillInterval=setInterval(()=>{if(treadmill.remaining>0){treadmill.remaining--;updateTreadmillClock()}if(treadmill.remaining===0)advanceTreadmill()},1000);
  render();
}
function treadmillNext(){advanceTreadmill()}
function treadmillReset(){stopTreadmill();treadmill={date:cur,phase:0,remaining:TREADMILL[0].minutes*60,running:false,rest:false,complete:false};render()}
function prepareTreadmill(){if(treadmill.date!==cur){stopTreadmill();treadmill={date:cur,phase:0,remaining:TREADMILL[0].minutes*60,running:false,rest:false,complete:false}}}
function renderTreadmill(){

function setCompact(exId,kind,val){
  const ex=(prog(cur).ex||[]).find(e=>e.id===exId); if(!ex)return;
  const s=ensureSession(cur);
  const u=exUnit(exId);
  const prev=s.sets[exId]||[];
  const other=kind==='w'?'r':(kind==='r'?'w':null);
  const mine=parseList(val);
  const theirs=other?setCells(prev,other,ex):[];                 // sibling values, untouched
  let n=Math.max(mine.length,theirs.length);
  if(n<=1)n=ex.sets;                                             // single value → the planned set count
  const pick=(l,i)=>l.length===0?null:(l.length===1?l[0]:(l[i]!==undefined?l[i]:null));
  const out=[];
  for(let i=0;i<n;i++){

      c[kind]=+raw;
      if(kind==='w')c.u=u;                                       // tag weight with this exercise's unit
    }
    const sib=pick(theirs,i);
    if(sib)Object.assign(c,sib);
    out.push(c);

function addProgressPhoto(input){

    canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
    canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);const photo=canvas.toDataURL('image/jpeg',.76);
    const store=bodyStore(),previous=store[todayStr()]&&store[todayStr()].photo;store[todayStr()]={...(store[todayStr()]||{}),photo};trimProgressPhotos();
    if(!save()){if(previous)store[todayStr()].photo=previous;else delete store[todayStr()].photo;alert('Не хватает места для фото. Удали старые фото и попробуй снова.');return}input.value='';render();
  };image.src=String(reader.result)};reader.readAsDataURL(file);
}
function removeProgressPhoto(){const entry=bodyStore()[todayStr()];if(!entry||!entry.photo)return;delete entry.photo;if(!entry.weight)delete bodyStore()[todayStr()];save();render()}
function bodyProgressHTML(){
  const rows=bodyRows(),today=bodyStore()[todayStr()]||{},current=safeWeight(today.weight),weights=rows.filter(row=>row.weight!==null);
  const first=weights[0],last=weights[weights.length-1],delta=first&&last?rnd(last.weight-first.weight):null;
  const photos=rows.filter(row=>row.photo).slice(-3).reverse();
  return `<section class="card"><div class="row between"><div><h3 style="margin:0;font-size:16px">Контроль формы</h3><div class="muted small" style="margin-top:3px">Вес тела и фото для сравнения.</div></div>${last?`<b style="color:var(--accent)">${fmtN(last.weight)} кг</b>`:''}</div><div class="body-form"><div class="field"><input id="bodyWeight" inputmode="decimal" placeholder="Вес тела" value="${current===null?'':current}"><span class="u" style="right:12px">кг</span></div><button class="btn sm" type="button" onclick="saveBodyWeight()">Сохранить</button></div><div class="photo-actions"><button class="btn sm ghost" type="button" onclick="document.getElementById('progressPhoto').click()">Добавить фото</button>${today.photo?'<button class="btn sm ghost" type="button" onclick="removeProgressPhoto()">Удалить фото</button>':''}</div><input id="progressPhoto" class="hide" type="file" accept="image/jpeg,image/png,image/webp" onchange="addProgressPhoto(this)"><div class="hint" style="margin-top:8px">Фото хранятся только на этом устройстве. Сохраняются последние ${MAX_PROGRESS_PHOTOS} снимков.</div>${delta!==null?`<div class="small" style="margin-top:10px">Изменение веса: <b style="color:${delta<=0?'var(--accent)':'var(--warn)'}">${delta>0?'+':''}${fmtN(delta)} кг</b></div>`:''}${weights.length>1?'<canvas id="bodyChart" height="160" style="margin-top:10px"></canvas>':''}${photos.length?`<div class="photo-grid">${photos.map(row=>`<figure><img src="${row.photo}" alt="Фото прогресса ${pretty(row.date)}"><figcaption>${pretty(row.date).split(',')[0]}</figcaption></figure>`).join('')}</div>`:''}</section>`;
}
function nextLiftPlan(){
  let date=todayStr();
  for(let i=0;i<21;i++){
    const plan=prog(date);
    if(plan.type==='lift'&&!(date===todayStr()&&isDone(date)))return{date,plan};
    date=addDays(date,1);
  }
  return null;
}
function smartProgressHTML(){
  const next=nextLiftPlan();if(!next)return '';
  const u=data.settings.unit;
  const rows=next.plan.ex.map(ex=>{
    const prev=lastSets(ex.id,addDays(next.date,1));
    const target=ex.m==='time'?`${ex.target} сек`:ex.target+' повт.';
    const suggested=recommendedWeight(ex,prev&&prev.sets,u);
    const recommendation=ex.m==='load'?(suggested?`${suggested} ${u}`:'Введи вес'):target;
    const previous=prev?setLabel(ex,prev.sets,u):'первая запись';
    return `<div class="histrow"><span><b>${ex.name}</b><br><span class="muted tiny">Прошлый раз: ${previous} · цель: ${target}</span></span><b style="color:var(--accent)">${recommendation}</b></div>`;
  }).join('');
  return `<section class="card"><div class="row between"><div><h3 style="margin:0;font-size:16px">Следующая тренировка</h3><div class="muted small" style="margin-top:3px">${next.plan.name} · ${pretty(next.date)}</div></div><span class="focus">ПЛАН</span></div><div style="margin-top:10px">${rows}</div></section>`;
}
function renderProgress(){
  const ids=Object.keys(exName).filter(id=>Object.keys(data.sessions).some(d=>{const b=bestVal({m:exName[id].m},data.sessions[d].sets[id]);return b!=null}));
  const bodyPts=bodyRows().filter(row=>row.weight!==null).map(row=>({date:row.date,v:row.weight}));
  if(!ids.length){done(`<h2 class="title">Прогресс</h2>${bodyProgressHTML()}${smartProgressHTML()}`);if(bodyPts.length>1)drawChart(bodyPts,'кг','bodyChart');return}
  if(!progSel||!ids.includes(progSel))progSel=ids[0];
  const m=exName[progSel].m;
  if(!progUnit)progUnit=data.settings.unit;
  const isLoad=m==='load';
  const ptsK=[]; // canonical values (load → kg)
  Object.keys(data.sessions).sort().forEach(d=>{const b=bestVal({m},data.sessions[d].sets[progSel]);if(b!=null)ptsK.push({date:d,k:b})});
  const pts=ptsK.map(p=>({date:p.date,v:isLoad?rnd(fromKg(p.k,progUnit)):p.k}));
  const ul=m==='time'?'сек':m==='reps'?'повт.':progUnit;
  let h=`<h2 class="title">Прогресс</h2>${bodyProgressHTML()}${smartProgressHTML()}<div class="sub">Лучший подход каждой тренировки.</div>
    <select onchange="progSel=this.value;render()">${ids.map(id=>`<option value="${id}" ${id===progSel?'selected':''}>${exName[id].name}</option>`).join('')}</select>`;
  if(isLoad)h+=`<div class="row between" style="margin-top:10px"><span class="muted small">Единица измерения</span>${segUnit(progUnit,'setProgUnit')}</div>`;
  const first=pts[0].v,lastp=pts[pts.length-1].v,best=Math.max(...pts.map(p=>p.v));
  const delta=rnd(lastp-first);
  h+=`<div class="statgrid" style="margin-top:12px">
    <div class="stat"><div class="v">${fmtN(lastp)}<span style="font-size:13px;color:var(--muted)"> ${ul}</span></div><div class="l">Последний</div></div>
    <div class="stat"><div class="v c">${fmtN(best)}<span style="font-size:13px;color:var(--muted)"> ${ul}</span></div><div class="l">Лучший</div></div>
    <div class="stat"><div class="v ${delta>=0?'a':''}" style="${delta<0?'color:#ef4444':''}">${delta>=0?'+':''}${fmtN(delta)}</div><div class="l">От старта</div></div>
  </div>`;
  h+=`<div class="card"><canvas id="chart" height="200"></canvas></div>`;
  h+=`<div class="card">${ptsK.slice().reverse().map(p=>{
    const right=isLoad?`${fmtN(p.k)} kg · ${fmtN(fromKg(p.k,'lb'))} lb`:`${p.k} ${ul}`;
    return `<div class="histrow"><span class="muted">${pretty(p.date)}</span><b>${right}</b></div>`;}).join('')}</div>`;
  done(h);
  drawChart(pts,ul);
  if(bodyPts.length>1)drawChart(bodyPts,'кг','bodyChart');
}
function drawChart(pts,unit,id='chart'){
  const c=document.getElementById(id);if(!c)return;
  const dpr=window.devicePixelRatio||1;const W=c.clientWidth,H=200;
  c.width=W*dpr;c.height=H*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);
  const padL=34,padR=12,padT=14,padB=22;
  const vals=pts.map(p=>p.v);let mn=Math.min(...vals),mx=Math.max(...vals);
  if(mn===mx){mn=mn-1;mx=mx+1;}const rng=mx-mn;
  const X=i=>pts.length<2?padL+(W-padL-padR)/2:padL+i*(W-padL-padR)/(pts.length-1);
  const Y=v=>padT+(1-(v-mn)/rng)*(H-padT-padB);
  // grid
  x.strokeStyle='#26303C';x.lineWidth=1;x.fillStyle='#8696A7';x.font='10px -apple-system,sans-serif';
  for(let g=0;g<=2;g++){const v=mn+rng*g/2;const yy=Y(v);
    x.beginPath();x.moveTo(padL,yy);x.lineTo(W-padR,yy);x.stroke();
    x.fillText(Math.round(v),4,yy+3);}
  // area + line
  x.beginPath();pts.forEach((p,i)=>{const xx=X(i),yy=Y(p.v);i?x.lineTo(xx,yy):x.moveTo(xx,yy)});
  const grad=x.createLinearGradient(0,padT,0,H-padB);grad.addColorStop(0,'rgba(52,211,153,.25)');grad.addColorStop(1,'rgba(52,211,153,0)');
  x.lineTo(X(pts.length-1),H-padB);x.lineTo(X(0),H-padB);x.closePath();x.fillStyle=grad;x.fill();
  x.beginPath();pts.forEach((p,i)=>{const xx=X(i),yy=Y(p.v);i?x.lineTo(xx,yy):x.moveTo(xx,yy)});
  x.strokeStyle='#34D399';x.lineWidth=2.5;x.lineJoin='round';x.stroke();
  pts.forEach((p,i)=>{const xx=X(i),yy=Y(p.v);x.beginPath();x.arc(xx,yy,3.5,0,7);x.fillStyle='#0B0F14';x.fill();
    x.lineWidth=2;x.strokeStyle='#34D399';x.stroke();});
}

  let h=`<h2 class="title">Программа и данные</h2>`;
  h+=`<div class="banner small"><b>Программа на массу - 12 недель.</b> Сейчас: ${phaseFor(cur).name}. Пресс добавляй в конце каждой тренировки.</div>`;

  h+=`<div class="center muted tiny" style="margin:4px 0 10px">Анимации упражнений: <a href="https://github.com/bryllim/workout-guide" target="_blank" rel="noopener" style="color:var(--accent2)">Workout Guide</a>, CC BY-SA 4.0.</div>`;

      <button class="btn sm ghost" onclick="document.getElementById('imp').click()">⬆︎ Импортировать</button>
    </div>
    <input id="imp" type="file" accept="application/json" class="hide" onchange="importData(this)">

  </div>`;
  const n=Object.values(data.sessions).filter(s=>s.completed).length;
  h+=`<div class="center muted tiny" style="margin:10px 0 4px">Тренировок записано: ${n} · с ${data.meta.startDate?pretty(data.meta.startDate):'—'}</div>`;

function exportData(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='резервная-копия-тренировок-'+todayStr()+'.json';a.click();
}
function importData(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d.sessions){if(!d.overrides)d.overrides={};if(!d.shifts)d.shifts=[];if(!d.body||!d.body.entries)d.body={entries:{}};data=d;save();render();alert('Резервная копия восстановлена ✓')}else alert('Неверный файл резервной копии')}catch(e){alert('Не удалось прочитать файл')}};
  r.readAsText(f);
}
function resetData(){if(confirm('Удалить все записанные тренировки и серии? Это действие нельзя отменить.')){data={meta:{startDate:null},sessions:{},settings:{unit:'kg',exUnit:{}},overrides:{},shifts:[],body:{entries:{}}};try{localStorage.removeItem(BKEY)}catch(e){}save();cur=todayStr();render()}}

/* ---------- Nav ---------- */
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;if(tab==='today')cur=todayStr();window.scrollTo(0,0);render()});
function enableRestSwipe(){
  let startX=0,startY=0;
  document.addEventListener('touchstart',event=>{const touch=event.changedTouches[0];startX=touch.clientX;startY=touch.clientY},{passive:true});
  document.addEventListener('touchend',event=>{
    if(tab!=='today'||prog(cur).type!=='lift')return;
    const touch=event.changedTouches[0],dx=touch.clientX-startX,dy=touch.clientY-startY;
    if(Math.abs(dy)>48)return;
    if(startX>window.innerWidth-64&&dx<-64)toggleRestWidget(true);
    if(restWidgetOpen&&startX<64&&dx>64)toggleRestWidget(false);
  },{passive:true});
}
