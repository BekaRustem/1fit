<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e17">
  <title>Фитнес Тренер Pro — Масса + Кардио на склоне</title>
  <style>
    :root {
      --bg: #0a0e17;
      --card: #131b2e;
      --card-active: #1a2540;
      --primary: #0284c7;
      --primary-light: #38bdf8;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: calc(85px + var(--safe-bottom));
      min-height: 100vh;
      user-select: none;
    }

    header {
      background: rgba(19, 27, 46, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-badge {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #0a0e17;
      font-size: 18px;
    }

    .logo-text h1 {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      line-height: 1.1;
    }

    .logo-text p {
      font-size: 10px;
      color: var(--primary-light);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .user-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .user-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 16px;
    }

    .section-label {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .goal-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }

    .goal-scroll::-webkit-scrollbar {
      display: none;
    }

    .goal-btn {
      flex: 0 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 14px;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .goal-btn.active {
      background: var(--primary);
      border-color: var(--primary-light);
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
    }

    .day-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }

    .day-tabs::-webkit-scrollbar {
      display: none;
    }

    .day-tab {
      flex: 0 0 auto;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .day-tab.active {
      background: #fff;
      color: #0a0e17;
      border-color: #fff;
      font-weight: 800;
    }

    .exercise-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 16px;
      margin-bottom: 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }

    .exercise-card.cardio-priority {
      border: 1px solid rgba(56, 189, 248, 0.35);
      background: linear-gradient(180deg, #16243d 0%, #131b2e 100%);
    }

    .ex-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .ex-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ex-num {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      color: var(--primary-light);
    }

    .ex-name {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      line-height: 1.25;
    }

    .ex-target-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary-light);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 4px 8px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .ex-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 12px;
    }

    .sets-block {
      background: rgba(10, 14, 23, 0.6);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 6px 10px;
      margin-bottom: 12px;
    }

    .set-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .set-row:last-child {
      border-bottom: none;
    }

    .set-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      width: 55px;
    }

    .weight-input {
      background: var(--card-active);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      width: 70px;
      text-align: center;
      padding: 6px;
      border-radius: 8px;
      outline: none;
    }

    .reps-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--primary-light);
      width: 80px;
      text-align: center;
    }

    .btn-set {
      background: var(--card-active);
      border: 1px solid var(--border);
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      min-width: 90px;
      text-align: center;
      transition: all 0.15s;
    }

    .btn-set.done {
      background: var(--accent);
      color: #0a0e17;
      border-color: transparent;
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    .ex-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
      padding: 8px 12px;
      border-radius: 12px;
    }

    .timer-buttons {
      display: flex;
      gap: 6px;
    }

    .btn-timer-chip {
      background: var(--card-active);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .rest-dock {
      position: fixed;
      bottom: calc(76px + var(--safe-bottom));
      left: 14px;
      right: 14px;
      max-width: 492px;
      margin: 0 auto;
      background: linear-gradient(135deg, #131b2e 0%, #0a0e17 100%);
      border: 1px solid var(--primary-light);
      border-radius: 20px;
      padding: 12px 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(56, 189, 248, 0.2);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: space-between;
    }

    .rest-dock.active {
      display: flex;
    }

    .rest-timer-display {
      font-size: 24px;
      font-weight: 900;
      color: var(--primary-light);
      letter-spacing: -0.5px;
    }

    .rest-label {
      font-size: 12px;
      color: #e2e8f0;
      font-weight: 700;
    }

    .rest-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-dock-action {
      background: var(--card-active);
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .navbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(19, 27, 46, 0.95);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-top: 1px solid var(--border);
      padding: 8px 10px calc(8px + var(--safe-bottom));
      display: flex;
      justify-content: space-around;
      z-index: 60;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      flex: 1;
    }

    .nav-btn svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
    }

    .nav-btn.active {
      color: var(--primary-light);
    }

    .library-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .lib-title {
      font-size: 13px;
      font-weight: 800;
      color: #fff;
    }

    .lib-cat {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Top App Bar -->
  <header>
    <div class="header-logo">
      <div class="logo-badge">⚡</div>
      <div class="logo-text">
        <h1>ПРО ТРЕНЕР</h1>
        <p>12 НЕДЕЛЬ МАССЫ + КАРДИО НА СКЛОНЕ</p>
      </div>
    </div>
    <div class="user-pill">
      <div class="user-dot"></div>
      <span id="user-badge-text">Программа Pro</span>
    </div>
  </header>

  <!-- ==================== VIEW 1: WORKOUT ==================== -->
  <div id="view-workout" class="container">
    <div class="section-label">
      <span>Выберите период:</span>
    </div>
    <div class="goal-scroll">
      <button class="goal-btn active" onclick="switchGoal('phase1', this)">
        <span>🏋️</span> Недели 1–4
      </button>
      <button class="goal-btn" onclick="switchGoal('phase2', this)">
        <span>🔥</span> Недели 5–8
      </button>
      <button class="goal-btn" onclick="switchGoal('phase3', this)">
        <span>💥</span> Недели 9–12
      </button>
      <button class="goal-btn" onclick="switchGoal('abs_program', this)">
        <span>🍫</span> Пресс (в конце)
      </button>
    </div>

    <!-- Day Sub-Tabs -->
    <div class="day-tabs" id="day-tabs-row"></div>

    <!-- Exercises Container -->
    <div id="exercises-container"></div>
  </div>

  <!-- ==================== VIEW 2: LIBRARY ==================== -->
  <div id="view-library" class="container hidden">
    <div class="section-label">
      <span>База упражнений</span>
      <span id="lib-count" style="color: var(--primary-light);"></span>
    </div>
    <input type="text" id="lib-search" placeholder="Поиск упражнения..." 
      style="width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; color: #fff; font-size: 13px; font-weight: 600; outline: none; margin-bottom: 12px;"
      oninput="searchLibrary()">
    <div id="library-list"></div>
  </div>

  <!-- ==================== VIEW 3: JOURNAL ==================== -->
  <div id="view-calendar" class="container hidden">
    <div class="section-label"><span>Журнал тренировок</span></div>
    <div id="workout-log-feed">
      <div class="library-item">
        <div><div class="lib-title">Неделя 1-4 • День 1 (Кардио + Плечи/Трапеции)</div><div class="lib-cat">Разминка 40 мин + 19 подходов</div></div>
        <span style="color: var(--accent); font-weight: 800; font-size: 11px;">✓ Выполнено</span>
      </div>
      <div class="library-item">
        <div><div class="lib-title">Неделя 1-4 • День 2 (Кардио + Ноги/Руки)</div><div class="lib-cat">Разминка 40 мин + 22 подхода</div></div>
        <span style="color: var(--accent); font-weight: 800; font-size: 11px;">✓ Выполнено</span>
      </div>
    </div>
  </div>

  <!-- Floating Rest Timer Dock -->
  <div class="rest-dock" id="rest-dock">
    <div>
      <div class="rest-timer-display" id="dock-timer-digits">60с</div>
      <div class="rest-label" id="dock-ex-title">Отдых</div>
    </div>
    <div class="rest-controls">
      <button class="btn-dock-action" onclick="adjustRest(-15)">-15с</button>
      <button class="btn-dock-action" onclick="adjustRest(15)">+15с</button>
      <button class="btn-dock-action" style="background: rgba(239, 68, 68, 0.2); color: #fca5a5;" onclick="closeRestTimer()">✕</button>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="navbar">
    <button class="nav-btn active" onclick="switchNav('workout', this)">
      <svg viewBox="0 0 24 24"><path d="M6 4v16M18 4v16M2 8h4M18 8h4M2 16h4M18 16h4M6 12h12"/></svg>
      <span>Программа</span>
    </button>
    <button class="nav-btn" onclick="switchNav('library', this)">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>База</span>
    </button>
    <button class="nav-btn" onclick="switchNav('calendar', this)">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Журнал</span>
    </button>
  </div>

  <script>
    /* ==================== 1. БАЗА УПРАЖНЕНИЙ ==================== */
    const DB = [
      // КАРДИО НА СКЛОНЕ
      { 
        id: 'incline_walk_40', 
        name: '40 минут быстрой ходьбы в гору (на склоне)', 
        cat: 'cardio', 
        target: 'Разминка / Жиросжигание / Пульс 115-130', 
        sets: 1, 
        repsDef: '40 мин', 
        isCardio: true,
        tip: 'Уклон дорожки 6–8%, темп 4.8–5.2 км/ч. Не держитесь за поручни, держите корпус ровно и активно двигайте руками.' 
      },

      // Плечи / Трапеции
      { id: 'db_seated_press', name: 'Жим гантелей сидя', cat: 'shoulders', target: 'Дельты (Плечи)', sets: 4, repsDef: '6-8', tip: 'Спина плотно прижата к спинке, мощный выжим вверх.' },
      { id: 'upright_row', name: 'Тяга штанги к подбородку', cat: 'shoulders', target: 'Дельты и Трапеции', sets: 3, repsDef: '10-12', tip: 'Тяните локтями вверх, гриф скользит вдоль корпуса.' },
      { id: 'bent_lateral_raise', name: 'Разведение гантелей в наклоне', cat: 'shoulders', target: 'Задняя дельта', sets: 3, repsDef: '10-12', tip: 'Корпус наклонен, разведение за счет задней дельты.' },
      { id: 'bent_lateral_100', name: 'Разведение гантелей в наклоне (100 повт.)', cat: 'shoulders', target: 'Задняя дельта', sets: 1, repsDef: '100', tip: '1 подход на 100 повторений. Допускаются короткие паузы.' },
      { id: 'arnold_press', name: 'Жим Арнольда', cat: 'shoulders', target: 'Передняя и средняя дельта', sets: 3, repsDef: '8-10', tip: 'Разворот ладоней наружу при выжимании гантелей вверх.' },
      { id: 'lateral_raise_100', name: 'Разведение гантелей через стороны (100 повт.)', cat: 'shoulders', target: 'Средняя дельта', sets: 1, repsDef: '100', tip: '1 подход на 100 повторений. Пампинг с микро-паузами.' },
      { id: 'standing_lateral_raise', name: 'Разведение гантелей через стороны стоя', cat: 'shoulders', target: 'Средняя дельта', sets: 4, repsDef: '10-12', tip: 'Локти слегка согнуты, движение строго в плоскости плеч.' },
      { id: 'front_raise', name: 'Подъем гантелей перед собой', cat: 'shoulders', target: 'Передняя дельта', sets: 4, repsDef: '12-15', tip: 'Подконтрольный подъем без раскачки тела.' },
      { id: 'cable_lateral_raise', name: 'Отведение руки в блоке', cat: 'shoulders', target: 'Средняя дельта', sets: 3, repsDef: '15-20', tip: 'Постоянное натяжение троса, максимальная изоляция.' },
      { id: 'military_press', name: 'Армейский жим', cat: 'shoulders', target: 'Плечи и кор', sets: 5, repsDef: '5', tip: 'Тяжелый жим штанги стоя. Пресс и ягодицы напряжены.' },
      { id: 'shrugs_barbell_heavy', name: 'Шраги со штангой (большой вес)', cat: 'back', target: 'Трапеции', sets: 5, repsDef: '5', tip: 'Большой вес. Подъем плеч вверх к ушам.' },
      { id: 'shrugs_barbell', name: 'Шраги со штангой', cat: 'back', target: 'Трапеции', sets: 4, repsDef: '6-8', tip: 'Пауза в верхней точке на 1 секунду.' },
      { id: 'shrugs_smith_behind', name: 'Шраги в Смите (гриф за спиной)', cat: 'back', target: 'Трапеции', sets: 3, repsDef: '10-12', tip: 'Гриф за спиной, лопатки сведены.' },

      // Ноги
      { id: 'barbell_squats', name: 'Приседания со штангой', cat: 'legs', target: 'Квадрицепс / Ягодицы', sets: 4, repsDef: ['15', '12', '8', '20'], tip: 'Пирамида по схеме: 1x15, 1x12, 1x8, 1x20.' },
      { id: 'romanian_deadlift', name: 'Румынская тяга', cat: 'legs', target: 'Бицепс бедра / Ягодицы', sets: 4, repsDef: ['12', '10', '8', '15'], tip: 'Схема: 1x12, 1x10, 1x8, 1x15. Отводите таз назад.' },
      { id: 'romanian_deadlift_5', name: 'Румынская тяга (5 подходов)', cat: 'legs', target: 'Бицепс бедра', sets: 5, repsDef: ['10', '8', '6', '8', '10'], tip: 'Пирамида: 10, 8, 6, 8, 10 повторений.' },
      { id: 'leg_press', name: 'Жим ногами', cat: 'legs', target: 'Квадрицепс', sets: 3, repsDef: '10-12', tip: 'Толкайте платформу пятками, не защелкивайте колени вверху.' },
      { id: 'calf_raises', name: 'Подъем на носки (в тренажере/со штангой)', cat: 'legs', target: 'Икры', sets: 3, repsDef: '8-10', tip: 'Полная амплитуда с растяжением в нижней точке.' },
      { id: 'leg_curl_elevated', name: 'Сгибание ног с приподнятым торсом', cat: 'legs', target: 'Бицепс бедра', sets: 3, repsDef: '10-12', tip: 'Торс приподнят (как при отжиманиях).' },
      { id: 'leg_curl_100', name: 'Сгибание ног в тренажере (100 повт.)', cat: 'legs', target: 'Бицепс бедра', sets: 1, repsDef: '100', tip: 'Один подход на 100 повторений для максимального пампа.' },
      { id: 'leg_extension', name: 'Разгибание ног в тренажере', cat: 'legs', target: 'Квадрицепс', sets: 3, repsDef: '10-12', tip: 'Пиковое напряжение квадрицепса в верхней точке.' },

      // Руки (Бицепс / Трицепс)
      { id: 'barbell_curl', name: 'Подъем штанги на бицепс', cat: 'arms', target: 'Бицепс', sets: 3, repsDef: '6-8', tip: 'Локти прижаты к бокам, читинг исключен.' },
      { id: 'barbell_curl_5x5', name: 'Подъем штанги на бицепс (5х5)', cat: 'arms', target: 'Бицепс', sets: 5, repsDef: '5', tip: 'Тяжелая силовая работа на 5 повторений.' },
      { id: 'barbell_curl_reverse', name: 'Подъем штанги прямым хватом', cat: 'arms', target: 'Брахиалис / Предплечья', sets: 3, repsDef: '10-12', tip: 'Хват сверху (пронированный).' },
      { id: 'scott_curl', name: 'Подъем штанги на скамье Скотта', cat: 'arms', target: 'Низ бицепса', sets: 3, repsDef: '10-12', tip: 'Локти на подушке, изолированное сгибание.' },
      { id: 'scott_curl_100', name: 'Подъем на скамье Скотта (100 повт.)', cat: 'arms', target: 'Бицепс', sets: 1, repsDef: '100', tip: '1 подход на 100 повторений с микро-паузами.' },
      { id: 'hammer_curl', name: 'Сгибание рук с гантелями («молот»)', cat: 'arms', target: 'Брахиалис / Бицепс', sets: 3, repsDef: '12-15', tip: 'Нейтральный хват гантелей.' },
      { id: 'alternate_db_curl', name: 'Альтернативный подъем гантелей', cat: 'arms', target: 'Бицепс', sets: 4, repsDef: '10-12', tip: 'Поочередный подъем с разворотом ладони кверху.' },
      { id: 'machine_arm_curl', name: 'Сгибание рук в тренажере', cat: 'arms', target: 'Бицепс', sets: 3, repsDef: '5-6', tip: 'Тяжелый изолированный подход.' },
      { id: 'french_press_db', name: 'Французский жим с гантелями', cat: 'arms', target: 'Трицепс', sets: 3, repsDef: '10-12', tip: 'Локти зафиксированы строго вверх.' },
      { id: 'french_press', name: 'Французский жим со штангой', cat: 'arms', target: 'Трицепс', sets: 5, repsDef: '6-8', tip: 'Опускание ко лбу или за голову.' },
      { id: 'close_grip_bench_incline_rev', name: 'Жим узким хватом в обратном наклоне', cat: 'arms', target: 'Трицепс', sets: 3, repsDef: '6-8', tip: 'Отрицательный наклон скамьи, акцент на трицепс.' },
      { id: 'close_grip_bench', name: 'Жим штанги узким хватом', cat: 'arms', target: 'Трицепс', sets: 4, repsDef: '8-10', tip: 'Хват на ширине плеч, локти ближе к корпусу.' },
      { id: 'tricep_pushdown', name: 'Разгибание рук в вертикальном блоке', cat: 'arms', target: 'Трицепс', sets: 3, repsDef: '12-15', tip: 'Полное выпрямление рук внизу с фиксацией.' },
      { id: 'dips', name: 'Отжимания на брусьях', cat: 'chest', target: 'Грудь / Трицепс', sets: 3, repsDef: 'Max', tip: 'Работа в каждом подходе до отказа.' },

      // Грудь / Спина
      { id: 'incline_barbell_press', name: 'Жим штанги на наклонной скамье', cat: 'chest', target: 'Верх груди', sets: 3, repsDef: '6-8', tip: 'Наклон скамьи 30–45 градусов.' },
      { id: 'incline_db_press', name: 'Жим гантелей на наклонной скамье', cat: 'chest', target: 'Верх груди', sets: 3, repsDef: '10-12', tip: 'Глубокая растяжка мышц груди внизу.' },
      { id: 'flat_db_press', name: 'Жим гантелей лежа', cat: 'chest', target: 'Грудь', sets: 3, repsDef: '10-12', tip: 'Классический жим гантелей на горизонтальной скамье.' },
      { id: 'decline_barbell_press', name: 'Жим штанги в обратном наклоне', cat: 'chest', target: 'Низ груди', sets: 3, repsDef: '12-15', tip: 'Скамья с отрицательным наклоном.' },
      { id: 'decline_db_press', name: 'Жим гантелей в обратном наклоне', cat: 'chest', target: 'Низ груди', sets: 3, repsDef: '8-10', tip: 'Мощная прокачка нижней линии грудных.' },
      { id: 'crossover_incline', name: 'Сведение в кроссовере на наклонной скамье', cat: 'chest', target: 'Грудь', sets: 3, repsDef: '10-12', tip: 'Сведение тросов перед собой на наклонной скамье.' },
      { id: 'crossover_standing', name: 'Сведение рук в кроссовере стоя', cat: 'chest', target: 'Грудь', sets: 3, repsDef: '12-15', tip: 'Пиковое сжатие груди в конечной точке.' },
      { id: 'bench_press_100', name: 'Жим лежа (100 повторений)', cat: 'chest', target: 'Грудь', sets: 1, repsDef: '100', tip: '1 памп-подход на 100 повторений с паузами.' },
      { id: 'bent_over_row', name: 'Тяга штанги в наклоне', cat: 'back', target: 'Широчайшие и середина спины', sets: 3, repsDef: '6-8', tip: 'Тяга к поясу за счет сведения лопаток.' },
      { id: 'lat_pulldown', name: 'Верхняя тяга к груди', cat: 'back', target: 'Широчайшие', sets: 3, repsDef: '10-12', tip: 'Тяните локти вниз и назад к грудине.' },
      { id: 'seated_cable_row', name: 'Тяга горизонтального блока', cat: 'back', target: 'Толщина спины', sets: 3, repsDef: '12-15', tip: 'Тяга рукояти к низу живота.' },
      { id: 'pullups_weighted', name: 'Подтягивания широким хватом с весом', cat: 'back', target: 'Широчайшие', sets: 3, repsDef: '6-8', tip: 'С дополнительным отягощением на поясе.' },

      // Пресс
      { id: 'cable_crunch', name: 'Скручивания в верхнем блоке (стоя/на коленях)', cat: 'abs', target: 'Пресс', sets: 4, repsDef: '12-15', tip: 'Тяните блок за счет округления спины и пресса.' },
      { id: 'hanging_leg_raise', name: 'Подъем ног к перекладине (или лежа)', cat: 'abs', target: 'Низ живота', sets: 3, repsDef: 'Max', tip: 'Подъем ног до касания турника либо до максимума.' },
      { id: 'fitball_crunch', name: 'Скручивания на фитболе', cat: 'abs', target: 'Пресс', sets: 3, repsDef: 'Max', tip: 'Большая амплитуда растяжения пресса на мяче.' }
    ];

    /* ==================== 2. ПРОГРАММЫ (КРОСС НА СКЛОНЕ ПЕРВЫМ ПУНКТОМ) ==================== */
    const PROGRAMS = {
      phase1: {
        title: 'Недели 1–4',
        days: [
          { title: 'День 1: Плечи/Трапеции', exercises: ['incline_walk_40', 'db_seated_press', 'upright_row', 'bent_lateral_raise', 'arnold_press', 'lateral_raise_100', 'shrugs_barbell_heavy'] },
          { title: 'День 2: Ноги/Руки', exercises: ['incline_walk_40', 'barbell_squats', 'romanian_deadlift', 'barbell_curl', 'close_grip_bench_incline_rev', 'scott_curl', 'french_press_db', 'hammer_curl', 'tricep_pushdown'] },
          { title: 'День 3: Трапеции/Плечи', exercises: ['incline_walk_40', 'shrugs_barbell', 'shrugs_smith_behind', 'upright_row', 'calf_raises', 'bent_lateral_100', 'military_press'] },
          { title: 'День 4: Грудные/Спина', exercises: ['incline_walk_40', 'incline_barbell_press', 'bent_over_row', 'flat_db_press', 'lat_pulldown', 'decline_barbell_press', 'seated_cable_row'] }
        ]
      },
      phase2: {
        title: 'Недели 5–8',
        days: [
          { title: 'День 1: Грудные/Бицепсы', exercises: ['incline_walk_40', 'incline_barbell_press', 'incline_db_press', 'crossover_incline', 'bench_press_100', 'barbell_curl_5x5'] },
          { title: 'День 2: Бедра', exercises: ['incline_walk_40', 'barbell_squats', 'romanian_deadlift', 'leg_press', 'leg_curl_elevated', 'leg_curl_100'] },
          { title: 'День 3: Бицепс/Грудные', exercises: ['incline_walk_40', 'barbell_curl', 'barbell_curl_reverse', 'hammer_curl', 'machine_arm_curl', 'scott_curl_100', 'incline_db_press'] },
          { title: 'День 4: Спина/Трицепс', exercises: ['incline_walk_40', 'bent_over_row', 'pullups_weighted', 'lat_pulldown', 'french_press', 'tricep_pushdown'] }
        ]
      },
      phase3: {
        title: 'Недели 9–12',
        days: [
          { title: 'День 1: Бедра', exercises: ['incline_walk_40', 'barbell_squats', 'leg_press', 'leg_extension', 'romanian_deadlift_5'] },
          { title: 'День 2: Плечи/Спина', exercises: ['incline_walk_40', 'upright_row', 'bent_lateral_raise', 'cable_lateral_raise', 'bent_over_row', 'lat_pulldown', 'shrugs_smith_behind'] },
          { title: 'День 3: Бицепсы/Трицепсы', exercises: ['incline_walk_40', 'scott_curl', 'alternate_db_curl', 'barbell_curl_reverse', 'close_grip_bench', 'french_press', 'tricep_pushdown'] },
          { title: 'День 4: Грудные/Плечи', exercises: ['incline_walk_40', 'decline_db_press', 'dips', 'crossover_standing', 'db_seated_press', 'standing_lateral_raise', 'front_raise'] }
        ]
      },
      abs_program: {
        title: 'Пресс (в конце любой тренировки)',
        days: [
          { title: 'Блок пресса из PDF', exercises: ['cable_crunch', 'hanging_leg_raise', 'fitball_crunch'] }
        ]
      }
    };

    /* ==================== 3. ЛОГИКА ==================== */
    let state = {
      goal: 'phase1',
      dayIdx: 0
    };

    function switchGoal(goalKey, btn) {
      state.goal = goalKey;
      state.dayIdx = 0;
      document.querySelectorAll('.goal-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderDayTabs();
      renderWorkoutExercises();
    }

    function renderDayTabs() {
      const prog = PROGRAMS[state.goal];
      const row = document.getElementById('day-tabs-row');
      row.innerHTML = '';

      prog.days.forEach((d, i) => {
        const b = document.createElement('button');
        b.className = `day-tab ${i === state.dayIdx ? 'active' : ''}`;
        b.textContent = d.title.split(':')[0];
        b.onclick = () => {
          state.dayIdx = i;
          renderDayTabs();
          renderWorkoutExercises();
        };
        row.appendChild(b);
      });
    }

    function renderWorkoutExercises() {
      const prog = PROGRAMS[state.goal];
      const day = prog.days[state.dayIdx] || prog.days[0];
      const container = document.getElementById('exercises-container');
      container.innerHTML = '';

      day.exercises.forEach((exId, idx) => {
        const ex = DB.find(e => e.id === exId);
        if (!ex) return;

        let setsRows = '';

        if (ex.isCardio) {
          // Специальная карточка для 40-минутного кардио
          setsRows = `
            <div class="set-row">
              <span class="set-label">Сессия</span>
              <div><input type="text" class="weight-input" style="width: 80px;" value="Уклон 7%"></div>
              <span class="reps-label">40 минут</span>
              <button class="btn-set" onclick="checkSet(this, '${ex.name}')">Начать</button>
            </div>
          `;
        } else {
          const numSets = ex.sets || 3;
          for (let s = 1; s <= numSets; s++) {
            let repValue = ex.repsDef;
            if (Array.isArray(ex.repsDef)) {
              repValue = ex.repsDef[s - 1] || ex.repsDef[ex.repsDef.length - 1];
            }

            setsRows += `
              <div class="set-row">
                <span class="set-label">Сет ${s}</span>
                <div><input type="number" class="weight-input" placeholder="кг" value="40"> кг</div>
                <span class="reps-label">${repValue} повт</span>
                <button class="btn-set" onclick="checkSet(this, '${ex.name}')">Выполнить</button>
              </div>
            `;
          }
        }

        const isCardioFirst = (idx === 0 && ex.isCardio);
        const card = document.createElement('div');
        card.className = `exercise-card ${isCardioFirst ? 'cardio-priority' : ''}`;
        card.innerHTML = `
          <div class="ex-header">
            <div class="ex-title-wrap">
              <div class="ex-num">${idx + 1}</div>
              <div class="ex-name">${ex.name}</div>
            </div>
            <div class="ex-target-badge">${isCardioFirst ? '⭐ ПЕРЕД ТРЕНИРОВКОЙ' : ex.target}</div>
          </div>
          <div class="ex-desc">${ex.tip}</div>
          <div class="sets-block">${setsRows}</div>
          <div class="ex-footer">
            <div class="timer-buttons">
              <button class="btn-timer-chip" onclick="startRest(60, '${ex.name}')">60с</button>
              <button class="btn-timer-chip" onclick="startRest(90, '${ex.name}')">90с</button>
              <button class="btn-timer-chip" onclick="startRest(120, '${ex.name}')">120с</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function checkSet(btn, exName) {
      btn.classList.toggle('done');
      const isDone = btn.classList.contains('done');
      btn.textContent = isDone ? '✓ Готово' : 'Выполнить';
      if (isDone) startRest(75, exName);
    }

    let restTimerId = null;
    let restSeconds = 60;

    function startRest(sec, exTitle) {
      clearInterval(restTimerId);
      restSeconds = sec || 60;
      const dock = document.getElementById('rest-dock');
      const digits = document.getElementById('dock-timer-digits');
      const title = document.getElementById('dock-ex-title');

      dock.classList.add('active');
      digits.textContent = `${restSeconds}с`;
      title.textContent = `Отдых: ${exTitle || ''}`;

      restTimerId = setInterval(() => {
        restSeconds--;
        digits.textContent = `${restSeconds}с`;
        if (restSeconds <= 0) {
          clearInterval(restTimerId);
          digits.textContent = 'В БОЙ!';
          setTimeout(closeRestTimer, 2000);
        }
      }, 1000);
    }

    function adjustRest(delta) {
      restSeconds = Math.max(5, restSeconds + delta);
      document.getElementById('dock-timer-digits').textContent = `${restSeconds}с`;
    }

    function closeRestTimer() {
      clearInterval(restTimerId);
      document.getElementById('rest-dock').classList.remove('active');
    }

    function renderLibrary() {
      const list = document.getElementById('library-list');
      list.innerHTML = '';
      document.getElementById('lib-count').textContent = `${DB.length} упр.`;

      DB.forEach(ex => {
        const item = document.createElement('div');
        item.className = 'library-item';
        item.innerHTML = `
          <div>
            <div class="lib-title">${ex.name}</div>
            <div class="lib-cat">${ex.target} • Подходов: ${ex.sets} (${Array.isArray(ex.repsDef) ? ex.repsDef.join('/') : ex.repsDef})</div>
          </div>
        `;
        list.appendChild(item);
      });
    }

    function searchLibrary() {
      const q = document.getElementById('lib-search').value.toLowerCase().trim();
      const list = document.getElementById('library-list');
      list.innerHTML = '';

      const filtered = DB.filter(e => e.name.toLowerCase().includes(q) || e.target.toLowerCase().includes(q));
      filtered.forEach(ex => {
        const item = document.createElement('div');
        item.className = 'library-item';
        item.innerHTML = `
          <div>
            <div class="lib-title">${ex.name}</div>
            <div class="lib-cat">${ex.target}</div>
          </div>
        `;
        list.appendChild(item);
      });
    }

    function switchNav(viewId, btn) {
      document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('view-' + viewId).classList.remove('hidden');
      if (btn) btn.classList.add('active');
      if (viewId === 'library') renderLibrary();
    }

    window.onload = () => {
      renderDayTabs();
      renderWorkoutExercises();
    };
  </script>
</body>
</html>
